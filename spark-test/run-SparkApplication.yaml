apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-test-stream
  namespace: spark-jobs
spec:
  type: Scala
  mode: cluster
  image: "spark-emr-test:1.0"
  imagePullPolicy: IfNotPresent
  mainClass: org.example.StateChangeDetetor
  mainApplicationFile: "local:///run/spark/work/spark-project-example-1.0.jar"
  sparkVersion: "3.5.2"
  sparkUIOptions:
    serviceLabels:
      test-label/v1: 'true'
  restartPolicy:
    type: Never
  volumes:
    - name: "spark-local-dir-1"
      persistentVolumeClaim:
        claimName: spark-pvc-scratch
    - name: "spark-events-dir"
      persistentVolumeClaim:
        claimName: spark-pvc-events
  sparkConf:
    spark.eventLog.enabled: "true"
    spark.log.level: "WARN"
    spark.streaming.backpressure.enabled: "true"
    spark.streaming.stopGracefullyOnShutdown: "true"
    spark.sql.streaming.stateStore.providerClass: "org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider"
    spark.sql.streaming.stateStore.minDeltasForSnapshot: "2"
    spark.sql.streaming.minBatchesToRetain: "3"
    spark.memory.fraction: "0.8"
    spark.memory.storageFraction: "0.1"
    spark.cleaner.periodicGC.interval: "5min"
    spark.cleaner.referenceTracking.blocking.shuffle: "true"
    spark.cleaner.referenceTracking.cleanCheckpoints: "true"
    spark.speculation: "true"
    
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.2
    serviceAccount: sc-spark
    envFrom:
      - configMapRef:
          name: spark-run-cm
      - secretRef:
          name: spark-run-secret

    volumeMounts:
      - name: "spark-events-dir"
        mountPath: "/ckpt_state"

  executor:
    cores: 1
    instances: 2
    memory: "1024m"
    labels:
      version: 3.5.2
    serviceAccount: sc-spark
    envFrom:
      - configMapRef:
          name: spark-run-cm
      - secretRef:
          name: spark-run-secret

  monitoring:
    exposeDriverMetrics: true
    exposeExecutorMetrics: true
    prometheus:
      jmxExporterJar: "/opt/spark/jars/jmx_prometheus_javaagent-1.0.1.jar"
      port: 8090

